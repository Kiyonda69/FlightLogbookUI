<script>
/* ---------- state ---------- */
var S = { boot: null, role: 'N', pattern: 'N1', member: 0, editing: null, listMonth: null, pendingIdx: null };
var PEND_KEY = 'logbook.pending'; // localStorage: legs queued with 「キューに追加」, not yet written to the sheet
var TOTAL_KEYS, COLS = {}, DUR_KEYS = [];
var $ = function (sel) { return document.querySelector(sel); };
var $$ = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };

/* ---------- helpers ---------- */
function toMin(v) {
  if (v === null || v === undefined) return 0;
  var s = String(v).trim(); if (!s) return 0;
  var m = s.match(/^(\d+):(\d{1,2})$/);
  if (m) return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  if (/^\d+$/.test(s)) return parseInt(s, 10);
  throw new Error('時間の形式が不正です (H:MM): ' + s);
}
function hm(min, blank) {
  min = Number(min) || 0;
  if (!min && blank) return '';
  var neg = min < 0 ? '-' : ''; min = Math.abs(min);
  return neg + Math.floor(min / 60) + ':' + ('0' + (min % 60)).slice(-2);
}
function hours1(min) { return (Number(min || 0) / 60).toFixed(1); }
/** UI label for a column: the JCAB label from the server, with "SIC" shown as "CO" in the UI. */
function lbl(k) { return (COLS[k] ? COLS[k].label : k).replace(/SIC/g, 'CO'); }
/** "0745" / "745" → "07:45" (clock) ; for durations "0130" → "1:30". Other values are returned unchanged. */
function normClock(v, isClock) {
  var s = String(v || '').trim(), m = s.match(/^(\d{1,2})(\d{2})$/);
  if (!m || parseInt(m[2], 10) > 59) return s;
  if (isClock) { if (parseInt(m[1], 10) > 23) return s; return ('0' + m[1]).slice(-2) + ':' + m[2]; }
  return parseInt(m[1], 10) + ':' + m[2];
}
function blockOf(dep, arr) {
  if (!dep || !arr) return 0;
  var d = toMin(dep), a = toMin(arr);
  return a >= d ? a - d : a + 1440 - d;
}
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(msg, isErr) {
  var t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, isErr ? 5000 : 2500);
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(e.message || String(e))); });
    r[fn].apply(r, args);
  });
}
function roleOf(f) {
  if (f.sim || f.ftd) return 'sim';
  if (f.pic && (f.sic || f.solo_sic)) return 'split';
  if (f.pic) return 'pic';
  if (f.sic || f.solo_sic || f.pus) return 'sic';
  return '';
}
/** Crew code for the current form selection: "M2/0", "SPLIT", "SIM". */
function crewCode() {
  if (S.role === 'split') return 'SPLIT';
  if (S.role === 'sim') return 'SIM';
  return S.pattern + '/' + S.member;
}

/* ---------- boot ---------- */
window.addEventListener('DOMContentLoaded', function () {
  $$('nav button').forEach(function (b) { b.addEventListener('click', function () { showTab(b.dataset.tab); }); });
  bindForm();
  $('#btnReload').addEventListener('click', function () { loadMonth($('#listMonth').value); });
  $('#listMonth').addEventListener('change', function () { loadMonth(this.value); });
  $('#sumYear').addEventListener('change', loadSummary);
  $('#recencyDays').addEventListener('change', loadRecency);
  $('#btnSaveSettings').addEventListener('click', saveSettings);
  $('#btnImport').addEventListener('click', importCsv);
  reboot(true);
});

/** (Re)load bootstrap data. `initial` = first load: also initialise the entry form. */
function reboot(initial) {
  return call('apiBootstrap').then(function (b) {
    S.boot = b; TOTAL_KEYS = b.totalKeys;
    b.columns.forEach(function (c) { COLS[c.key] = c; });
    DUR_KEYS = b.columns.filter(function (c) { return c.kind === 'min'; }).map(function (c) { return c.key; });
    renderHeader(b.cumulative);
    fillDatalists(b);
    buildDetailGrid();
    buildCarryGrid(b.settings);
    fillSettings(b.settings);
    var lm = $('#listMonth'); lm.innerHTML = '';
    var months = b.months.length ? b.months : [b.today.substring(0, 7)];
    months.forEach(function (m) { var o = document.createElement('option'); o.value = m; o.textContent = m; lm.appendChild(o); });
    renderPending();
    if (initial) resetForm();
  }).catch(function (e) { toast(e.message, true); });
}

function showTab(name) {
  $$('nav button').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === name); });
  $$('.tab').forEach(function (t) { t.classList.toggle('active', t.id === 'tab-' + name); });
  if (name === 'list') loadMonth($('#listMonth').value);
  if (name === 'summary') { fillYears(); loadSummary(); loadRecency(); loadQualification(); }
  if (name === 'settings') loadReports();
}

function renderHeader(c) {
  $('#hdrStats').innerHTML =
    '<span>総飛行時間 <b>' + hm(c.block) + '</b></span>' +
    '<span>PIC <b>' + hm(c.pic) + '</b></span>' +
    '<span>CO <b>' + hm(c.sic + c.solo_sic) + '</b></span>' +
    '<span>夜間 <b>' + hm(c.pic_night + c.sic_night) + '</b></span>' +
    '<span>計器 <b>' + hm(c.ifr) + '</b></span>' +
    '<span>離陸/着陸 <b>' + c.takeoffs + '/' + c.landings + '</b></span>' +
    (loadPending().length ? '<span>未保存 <b class="pend">' + loadPending().length + '</b></span>' : '');
}

function fillDatalists(b) {
  var types = {}, regs = [], apts = [];
  b.aircraft.forEach(function (a) { types[a.aircraft_type] = true; regs.push(a.registration); });
  b.airports.forEach(function (a) { apts.push(a.icao); });
  $('#dlTypes').innerHTML = Object.keys(types).sort().map(function (t) { return '<option value="' + esc(t) + '">'; }).join('');
  $('#dlRegs').innerHTML = regs.sort().map(function (r) { return '<option value="' + esc(r) + '">'; }).join('');
  $('#dlApts').innerHTML = apts.sort().map(function (a) { return '<option value="' + esc(a) + '">'; }).join('');
  $('#tzLabel').textContent = b.settings.time_basis || 'UTC';
  $$('.tz').forEach(function (e) { e.textContent = b.settings.time_basis || 'UTC'; });
}

/* ---------- form ---------- */
var F = function () { return document.forms.flightForm; };
var fv = function (k) { var el = F().elements[k]; return el ? el.value : ''; };
var fset = function (k, v) {
  var el = F().elements[k]; if (!el) return;
  if (el.type === 'checkbox') { el.checked = v === '1' || v === 1 || v === true; return; }
  el.value = v === undefined || v === null ? '' : v;
};

function buildDetailGrid() {
  var g = $('#detailGrid'); g.innerHTML = '';
  DUR_KEYS.forEach(function (k) {
    if (F().elements[k]) return; // already has a dedicated input (block, ifr) — duplicate names would break form.elements[k]
    var d = document.createElement('div');
    d.innerHTML = '<label title="' + esc(lbl(k)) + '">' + esc(lbl(k)) + '</label><input class="dur" name="' + k + '" placeholder="H:MM">';
    g.appendChild(d);
  });
}

function bindForm() {
  var f = F();
  // digit-only shortcuts: register FIRST so the other change handlers see the normalised value
  ['dep_time', 'arr_time'].forEach(function (k) { f.elements[k].addEventListener('change', function () { this.value = normClock(this.value, true); }); });
  $$('#flightForm input.dur').forEach(function (el) { el.addEventListener('change', function () { this.value = normClock(this.value, false); }); });
  ['dep_time', 'arr_time'].forEach(function (k) {
    f.elements[k].addEventListener('change', function () { recalcBlock(false); });
    f.elements[k].addEventListener('input', function () { recalcBlock(true); });
  });
  f.elements._actual.addEventListener('change', applyRole);
  f.elements._night.addEventListener('change', applyRole);
  $('#crewPattern').addEventListener('change', function () { S.pattern = this.value; fillMembers(); applyRole(); });
  $('#crewMember').addEventListener('change', function () { S.member = Number(this.value); applyRole(); });
  f.elements._split_pic.addEventListener('change', applyRole);
  f.elements._xc.addEventListener('change', applyRole);
  $$('#roleSeg button').forEach(function (b) {
    b.addEventListener('click', function () { setRole(b.dataset.role); applyRole(); });
  });
  ['aircraft_type', 'registration', 'dep', 'arr', 'flight_no'].forEach(function (k) {
    f.elements[k].addEventListener('change', function () { this.value = this.value.toUpperCase().trim(); });
  });
  f.elements.registration.addEventListener('change', function () {
    var reg = this.value.toUpperCase().trim();
    var hit = (S.boot.aircraft || []).filter(function (a) { return a.registration === reg; })[0];
    if (hit && !fv('aircraft_type')) fset('aircraft_type', hit.aircraft_type);
  });
  $('#btnSave').addEventListener('click', saveFlight);
  $('#btnQueue').addEventListener('click', queueFlight);
  $('#btnSaveAll').addEventListener('click', saveAllPending);
  $('#btnClearPending').addEventListener('click', clearPending);
  $('#btnReset').addEventListener('click', function () { resetForm(); });
  $('#btnCopyReturn').addEventListener('click', copyReturn);
}

/** Recompute block time from OUT/IN clocks (wrapping midnight) and redistribute by role. */
function recalcBlock(silent) {
  if (S.role === 'sim') return;
  try {
    if (!/^\d{1,2}:\d{2}$/.test(fv('dep_time')) || !/^\d{1,2}:\d{2}$/.test(fv('arr_time'))) return;
    var b = blockOf(fv('dep_time'), fv('arr_time'));
    if (b) { fset('_actual', hm(b)); applyRole(); }
  } catch (e) { if (!silent) toast(e.message, true); }
}

function setRole(r, pattern, member) {
  S.role = r;
  $$('#roleSeg button').forEach(function (b) { b.classList.toggle('active', b.dataset.role === r); });
  $('#splitPic').style.display = r === 'split' ? '' : 'none';
  var isCrew = r === 'N' || r === 'M' || r === 'D';
  $('#crewPattern').style.display = isCrew ? '' : 'none';
  $('#crewMember').style.display = isCrew ? '' : 'none';
  if (isCrew) {
    var list = CREW_PATTERNS.filter(function (p) { return p.kind === r; });
    S.pattern = pattern && list.some(function (p) { return p.id === pattern; }) ? pattern : (CREW_DEFAULT_PATTERN[r] || list[0].id);
    $('#crewPattern').innerHTML = list.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === S.pattern ? ' selected' : '') + '>' + esc(p.id + ': ' + p.crew.join(' / ')) + '</option>';
    }).join('');
    S.member = member || 0;
    fillMembers();
  }
  $('#roleHint').textContent = {
    N: '2 名編成: ブロックタイム全部を自分の DUTY の欄に記入します',
    M: 'マルチ編成: 配分表 (Rev.2) の分数でブロックタイムを配分し、端数は四捨五入。飛行時間 (8項) は配分した時間の合計です',
    D: 'ダブル編成: 配分表 (Rev.2) の分数でブロックタイムを配分し、端数は四捨五入。飛行時間 (8項) は配分した時間の合計です',
    split: '手動分割: 指定した PIC 時間を機長側、残りを副操縦士側に配分します',
    sim: '模擬飛行装置: 飛行時間 = 0、離着陸 = 0、SIM 時間にブロックタイムを入れます'
  }[r];
}

/** Populate the "自分" select with the crew members of the current pattern and their formulas. */
function fillMembers() {
  var p = crewPattern(S.pattern); if (!p) return;
  if (S.member >= p.crew.length) S.member = 0;
  $('#crewMember').innerHTML = p.crew.map(function (duty, i) {
    return '<option value="' + i + '"' + (i === S.member ? ' selected' : '') + '>' + esc('自分: ' + (i + 1) + ' ' + duty + ' (' + crewFormula(p.alloc[i]) + ')') + '</option>';
  }).join('');
}

/**
 * Distribute the actual block time (OUT→IN) into the JCAB columns:
 *  N / M / D : crew allocation table (CrewRules.html) — 飛行時間 = sum of the allocated terms
 *  split     : manual PIC / CO split of the whole block
 *  sim       : simulator session
 */
function applyRole() {
  try {
    var actual = toMin(fv('_actual')), night = toMin(fv('_night')), xc = fv('_xc') === '1' ? actual : 0;
    var v = {}; DUR_KEYS.forEach(function (k) { if (k !== 'ifr') v[k] = 0; });
    var info = '';
    if (S.role === 'sim') {
      v.sim = actual || toMin(fv('sim')); v.block = 0;
      fset('takeoffs', 0); fset('landings', 0);
      info = 'SIM ' + hm(v.sim);
    } else if (S.role === 'split') {
      var p = Math.min(toMin(fv('_split_pic')), actual), s = actual - p;
      v.block = actual; v.pic = p; v.pic_xc = xc ? p : 0; v.sic = s; v.sic_xc = xc ? s : 0;
      var pn = Math.min(night, p); v.pic_night = pn; v.sic_night = Math.min(night - pn, s);
      info = '飛行時間 ' + hm(actual) + ' = 機長 ' + hm(p) + ' + 副操縦士 ' + hm(s);
    } else {
      var r = allocateCrew(S.pattern, S.member, actual, xc, night);
      ['block', 'pic', 'solo_sic', 'pus', 'sic', 'pic_xc', 'pic_night', 'sic_xc', 'sic_night'].forEach(function (k) { v[k] = r[k]; });
      var parts = [];
      if (r.pic) parts.push('機長 ' + hm(r.pic));
      if (r.solo_sic) parts.push('単独・副機長 ' + hm(r.solo_sic));
      if (r.pus) parts.push('機長見習 ' + hm(r.pus));
      if (r.sic) parts.push('副操縦士 ' + hm(r.sic));
      info = r.duty + ' (' + r.formula + ') → 飛行時間 ' + hm(r.block) + (parts.length ? ' = ' + parts.join(' + ') : '') +
        (night ? ' / 夜間 機長側 ' + hm(r.pic_night) + ' 副操縦士側 ' + hm(r.sic_night) : '');
    }
    Object.keys(v).forEach(function (k) { fset(k, hm(v[k], true)); });
    if (actual) $('#roleHint').textContent = info;
  } catch (e) { toast(e.message, true); }
}

function resetForm(keep) {
  var f = F(); var prev = keep ? readForm() : null;
  f.reset();
  DUR_KEYS.forEach(function (k) { fset(k, ''); });
  fset('id', ''); S.editing = null; S.pendingIdx = null;
  $('#formTitle').textContent = '新規レグ入力';
  $('#btnQueue').textContent = 'キューに追加';
  var st = S.boot ? S.boot.settings : {};
  fset('date', prev ? prev.date : (S.boot ? S.boot.today : ''));
  fset('aircraft_type', prev ? prev.aircraft_type : (st.default_aircraft_type || ''));
  fset('registration', prev ? prev.registration : '');
  fset('takeoffs', st.default_takeoffs !== undefined ? st.default_takeoffs : 1);
  fset('landings', st.default_landings !== undefined ? st.default_landings : 1);
  fset('_xc', '1');
  if (prev) setRole(S.role, S.pattern, S.member); else setRole('N', 'N1', 0);
  $('#formStatus').textContent = '';
}

function readForm() {
  var f = F(), o = {};
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name) o[el.name] = el.type === 'checkbox' ? (el.checked ? '1' : '') : el.value; });
  return o;
}

/** Read + validate the form into a flight record (minutes, crew code). Returns null (after a toast) on error. */
function buildRecord() {
  if (!fv('_actual')) recalcBlock(true);
  if (!fv('block') && S.role !== 'sim' && fv('_actual')) applyRole();
  if (S.role === 'sim' && !fv('sim') && fv('_actual')) applyRole();
  var o = readForm();
  var rec = { id: o.id, crew: crewCode() };
  Object.keys(COLS).forEach(function (k) {
    if (COLS[k].kind === 'meta' && k !== 'id') return;
    if (o[k] !== undefined) rec[k] = o[k];
  });
  try { DUR_KEYS.forEach(function (k) { rec[k] = toMin(o[k]); }); } catch (e) { toast(e.message, true); return null; }
  ['aircraft_type', 'registration', 'dep', 'arr', 'flight_no'].forEach(function (k) { rec[k] = String(rec[k] || '').trim().toUpperCase(); });
  rec.takeoffs = Number(o.takeoffs) || 0; rec.landings = Number(o.landings) || 0;
  if (!rec.date) { toast('月日を入力してください', true); return null; }
  var missing = [['aircraft_type', '航空機の型式'], ['dep', '出発地'], ['arr', '到着地']].concat(S.role === 'sim' ? [] : [['registration', '登録記号']])
    .filter(function (m) { return !rec[m[0]]; }).map(function (m) { return m[1]; });
  if (missing.length) { toast(missing.join('・') + ' を入力してください', true); return null; }
  if (!rec.block && !rec.sim && !rec.ftd) { toast('飛行時間が 0 です。OUT/IN 時刻またはブロックタイムを入力してください', true); return null; }
  return rec;
}

/** After a leg is stored (queued or saved): keep date / aircraft / crew, chain the next departure. */
function nextLegForm(saved, wasEdit) {
  resetForm(!wasEdit);
  if (!wasEdit) fset('dep', saved.arr);
}

/** 今すぐ保存: write this one leg to the sheet immediately (one round trip, year sheet refresh). */
function saveFlight() {
  var rec = buildRecord(); if (!rec) return;
  var pendIdx = S.pendingIdx;
  var btn = $('#btnSave'); btn.disabled = true; $('#formStatus').textContent = '保存中…';
  call(rec.id ? 'apiUpdateFlight' : 'apiAddFlight', rec).then(function (res) {
    var saved = res.flight;
    toast((rec.id ? '更新' : '追加') + 'しました: ' + saved.date + ' ' + saved.flight_no + (res.refreshed && res.refreshed.length ? ' / ' + res.refreshed.join(', ') + ' 更新' : ''));
    if (pendIdx !== null) { var l = loadPending(); l.splice(pendIdx, 1); savePending(l); }
    nextLegForm(saved, !!rec.id);
    return reboot().then(function () { if (S.listMonth) loadMonth(S.listMonth); });
  }).catch(function (e) { toast(e.message, true); $('#formStatus').textContent = ''; })
    .then(function () { btn.disabled = false; });
}

/* ---------- pending queue (localStorage) ---------- */
function loadPending() {
  try { var l = JSON.parse(localStorage.getItem(PEND_KEY) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; }
}
function savePending(list) {
  try { if (list.length) localStorage.setItem(PEND_KEY, JSON.stringify(list)); else localStorage.removeItem(PEND_KEY); }
  catch (e) { toast('この端末に一時保存できません: ' + e.message, true); }
  renderPending();
}
/** キューに追加: validate the form and keep the leg in localStorage (no network). */
function queueFlight() {
  var rec = buildRecord(); if (!rec) return;
  var l = loadPending();
  if (S.pendingIdx !== null && l[S.pendingIdx]) l[S.pendingIdx] = rec; else l.push(rec);
  savePending(l);
  toast((rec.id ? '更新を' : '') + 'キューに追加しました: ' + rec.date + ' ' + rec.flight_no + ' (未保存 ' + l.length + ' 件)');
  nextLegForm(rec, !!rec.id);
  if (S.boot) renderHeader(S.boot.cumulative);
}
/** Pending legs are shown greyed at the top of 最近の記録; the card's 保存 button writes them all. */
function renderPending() {
  var l = loadPending();
  if (S.boot) renderTable($('#recentTable'), S.boot.recent, { compact: true, pending: l });
  $('#btnSaveAll').style.display = l.length ? '' : 'none';
  $('#btnClearPending').style.display = l.length ? '' : 'none';
  $('#btnSaveAll').textContent = '保存 (' + l.length + ' 件)';
}
function editPending(i) {
  var f = loadPending()[i]; if (!f) return;
  editFlight(f);
  S.pendingIdx = i;
  $('#formTitle').textContent = '未保存レグの編集 (#' + (i + 1) + '): ' + f.date + ' ' + (f.flight_no || '');
  $('#btnQueue').textContent = 'キューを更新';
}
function clearPending() {
  var l = loadPending(); if (!l.length) return;
  if (!confirm('未保存の ' + l.length + ' 件をすべて破棄しますか?（スプレッドシートには書き込まれません）')) return;
  savePending([]); resetForm(); if (S.boot) renderHeader(S.boot.cumulative);
}
/** まとめて保存: one apiSaveFlights request for the whole queue (atomic on the server). */
function saveAllPending() {
  var l = loadPending(); if (!l.length) { toast('未保存のレグはありません'); return; }
  var lbl0 = $('#btnSaveAll').textContent;
  var btn = $('#btnSaveAll'); btn.disabled = true; $('#btnClearPending').disabled = true;
  $('#pendingStatus').textContent = l.length + ' 件を保存中…'; btn.textContent = '保存中…';
  var t0 = Date.now();
  call('apiSaveFlights', l).then(function (res) {
    savePending([]);
    toast('保存しました: 追加 ' + res.added + ' / 更新 ' + res.updated + (res.refreshed && res.refreshed.length ? ' / ' + res.refreshed.join(', ') + ' 更新' : '') + ' (' + Math.round((Date.now() - t0) / 100) / 10 + ' 秒)');
    $('#pendingStatus').textContent = '';
    if (S.pendingIdx !== null) resetForm();
    return reboot().then(function () { if (S.listMonth) loadMonth(S.listMonth); });
  }).catch(function (e) {
    toast(e.message, true);
    $('#pendingStatus').textContent = '保存できませんでした（キューは残っています）: ' + e.message;
  }).then(function () { btn.disabled = false; btn.textContent = lbl0; $('#btnClearPending').disabled = false; });
}

function copyReturn() {
  var o = readForm();
  var dep = o.dep, arr = o.arr;
  // right after 「キューに追加」 the form only holds the next departure: take the last queued leg instead
  var last = loadPending().slice(-1)[0];
  if ((!dep || !arr) && last) { dep = last.dep; arr = last.arr; }
  resetForm(true);
  fset('dep', arr); fset('arr', dep);
  fset('flight_no', ''); fset('dep_time', ''); fset('arr_time', ''); fset('_actual', ''); fset('block', ''); fset('_night', ''); fset('ifr', '');
  DUR_KEYS.forEach(function (k) { fset(k, ''); });
  F().elements.flight_no.focus();
}

function editFlight(f) {
  resetForm();
  S.editing = f.id;
  $('#formTitle').textContent = '編集: ' + f.date + ' ' + (f.flight_no || '');
  Object.keys(f).forEach(function (k) { if (F().elements[k]) fset(k, COLS[k] && COLS[k].kind === 'min' ? hm(f[k], true) : f[k]); });
  fset('_xc', (f.pic_xc || f.sic_xc) ? '1' : '0');
  fset('_split_pic', hm(f.pic, true));
  // Allocated legs store fractions of the real times; invert the member's fraction sum so the
  // "実時間" inputs show what was actually flown (e.g. 1:20 + 1:20 at 2/3 → 4:00).
  var cc = parseCrewCode(f.crew), fracSum = 1;
  if (cc && crewPattern(cc.patternId) && crewPattern(cc.patternId).alloc[cc.member]) {
    fracSum = crewPattern(cc.patternId).alloc[cc.member].reduce(function (a, t) { return a + t[0] / t[1]; }, 0) || 1;
  }
  fset('_night', hm(Math.round((f.pic_night + f.sic_night) / fracSum), true));
  fset('_actual', hm(blockOf(f.dep_time, f.arr_time) || Math.round(f.block / fracSum) || f.sim, true));
  if (cc && crewPattern(cc.patternId)) setRole(cc.patternId.charAt(0), cc.patternId, cc.member);
  else if (f.crew === 'SIM' || roleOf(f) === 'sim') setRole('sim');
  else if (f.crew === 'SPLIT' || roleOf(f) === 'split') setRole('split');
  else if (roleOf(f) === 'sic') setRole('N', 'N1', 1);
  else setRole('N', 'N1', 0);
  // stored values are kept as-is (legacy rows may follow older allocation rules); the hint shows the code
  $('#roleHint').textContent = '保存済みの値を表示しています (編成: ' + (f.crew || '未記録') + ')。編成や時刻を変えると再計算します';
  showTab('entry'); window.scrollTo(0, 0);
}

function deleteFlight(f) {
  if (!confirm('削除しますか?\n' + f.date + ' ' + f.flight_no + ' ' + f.dep + '-' + f.arr)) return;
  call('apiDeleteFlight', f.id).then(function (res) {
    toast('削除しました' + (res.refreshed && res.refreshed.length ? ' / ' + res.refreshed.join(', ') + ' 更新' : ''));
    return reboot().then(function () { if (S.listMonth) loadMonth(S.listMonth); });
  }).catch(function (e) { toast(e.message, true); });
}

/* ---------- tables ---------- */
var LIST_COLS = ['date', 'aircraft_type', 'registration', 'dep', 'arr', 'dep_time', 'arr_time', 'flight_no', 'takeoffs', 'landings', 'block', 'pic', 'pic_xc', 'pic_night', 'sic', 'sic_xc', 'sic_night', 'ifr', 'sim', 'crew', 'qpr', 'remarks'];

function renderTable(table, flights, opts) {
  opts = opts || {};
  var cols = opts.compact ? LIST_COLS.slice(0, 12).concat(['sic', 'ifr', 'qpr']) : LIST_COLS;
  var h = '<thead><tr>' + cols.map(function (k) { return '<th class="' + (COLS[k].kind === 'min' || COLS[k].kind === 'int' ? 'num' : '') + '">' + esc(shortLabel(k)) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
  var pending = opts.pending || [];
  var rowCells = function (f) {
    return cols.map(function (k) {
      var c = COLS[k], v = f[k];
      if (c.kind === 'min') return '<td class="num">' + hm(v, true) + '</td>';
      if (c.kind === 'int') return '<td class="num">' + (v || '') + '</td>';
      if (k === 'crew') return '<td>' + (v ? '<span class="tag">' + esc(v) + '</span>' : '') + '</td>';
      if (k === 'qpr') return '<td>' + (v === '1' ? '<span class="tag qpr">QPR</span>' : '') + '</td>';
      return '<td>' + esc(v) + '</td>';
    }).join('');
  };
  pending.forEach(function (f, i) {
    h += '<tr class="pending">' + rowCells(f) + '<td><span class="tag">未保存' + (f.id ? '・更新' : '') + '</span> <button class="btn small" data-p="' + i + '" data-act="edit">編集</button> <button class="btn small danger" data-p="' + i + '" data-act="del">削除</button></td></tr>';
  });
  flights.forEach(function (f, i) {
    h += '<tr class="' + roleOf(f) + '">' + rowCells(f) + '<td><button class="btn small" data-i="' + i + '" data-act="edit">編集</button> <button class="btn small danger" data-i="' + i + '" data-act="del">削除</button></td></tr>';
  });
  h += '</tbody>';
  if (opts.totals) {
    var t = opts.totals, lab = { subtotal: '項小計', carried: '前項までの合計', total: '合計' };
    h += '<tfoot>' + ['subtotal', 'carried', 'total'].map(function (k) {
      return '<tr class="total">' + cols.map(function (ck, ci) {
        if (ci === 7) return '<td>' + lab[k] + '</td>';
        if (TOTAL_KEYS.indexOf(ck) < 0) return '<td></td>';
        return '<td class="num">' + (COLS[ck].kind === 'int' ? t[k][ck] : hm(t[k][ck])) + '</td>';
      }).join('') + '<td></td></tr>';
    }).join('') + '</tfoot>';
  }
  table.innerHTML = h;
  table.onclick = function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.p !== undefined) {
      var pi = Number(b.dataset.p);
      if (b.dataset.act === 'edit') editPending(pi);
      else { var l2 = loadPending(); l2.splice(pi, 1); savePending(l2); if (S.pendingIdx === pi) resetForm(); if (S.boot) renderHeader(S.boot.cumulative); }
      return;
    }
    var f = flights[Number(b.dataset.i)];
    if (b.dataset.act === 'edit') editFlight(f); else deleteFlight(f);
  };
}
function shortLabel(k) {
  return { aircraft_type: '型式', registration: '登録', dep: '出発', arr: '到着', dep_time: 'OUT', arr_time: 'IN', flight_no: '内容', block: '飛行', pic: 'PIC', pic_xc: 'PIC野外', pic_night: 'PIC夜', sic: 'CO', sic_xc: 'CO野外', sic_night: 'CO夜', ifr: '計器', sim: 'SIM', takeoffs: 'T/O', landings: 'LDG', date: '月日', remarks: '自由欄', crew: '編成', qpr: 'QPR' }[k] || lbl(k);
}

function loadMonth(ym) {
  if (!ym) return;
  S.listMonth = ym; $('#listInfo').textContent = '読み込み中…';
  call('apiGetMonth', ym).then(function (r) {
    renderTable($('#listTable'), r.flights, { totals: r.totals });
    $('#listInfo').textContent = r.flights.length + ' レグ / 飛行時間 ' + hm(r.totals.subtotal.block);
  }).catch(function (e) { toast(e.message, true); });
}

/* ---------- summary ---------- */
function fillYears() {
  var sel = $('#sumYear'); if (sel.options.length) return;
  var years = {}; (S.boot.months || []).forEach(function (m) { years[m.substring(0, 4)] = true; });
  years[S.boot.today.substring(0, 4)] = true;
  Object.keys(years).sort().reverse().forEach(function (y) { var o = document.createElement('option'); o.value = y; o.textContent = y + '年'; sel.appendChild(o); });
}
function kpi(el, t, keys) {
  el.innerHTML = keys.map(function (k) {
    var v = k === 'takeoffs' || k === 'landings' ? t[k] : hm(t[k]);
    return '<div><label>' + esc(lbl(k)) + '</label><b>' + v + '</b></div>';
  }).join('');
}
var KPI_KEYS = ['block', 'pic', 'sic', 'solo_sic', 'pus', 'pic_xc', 'sic_xc', 'pic_night', 'sic_night', 'ifr', 'hood', 'sim', 'takeoffs', 'landings'];
function loadSummary() {
  var y = $('#sumYear').value;
  kpi($('#kpiCum'), S.boot.cumulative, KPI_KEYS);
  call('apiYearSummary', y).then(function (r) {
    $('#sumTitle').textContent = y + '年 月別集計';
    var keys = ['block', 'pic', 'sic', 'pic_night', 'sic_night', 'ifr', 'sim', 'takeoffs', 'landings'];
    var h = '<thead><tr><th>月</th><th class="num">レグ</th>' + keys.map(function (k) { return '<th class="num">' + esc(shortLabel(k)) + '</th>'; }).join('') + '</tr></thead><tbody>';
    r.months.forEach(function (m) {
      h += '<tr><td>' + m.ym + '</td><td class="num">' + m.count + '</td>' + keys.map(function (k) { return '<td class="num">' + (k === 'takeoffs' || k === 'landings' ? m[k] : hm(m[k], true)) + '</td>'; }).join('') + '</tr>';
    });
    h += '<tr class="total"><td>年計</td><td class="num">' + r.months.reduce(function (a, m) { return a + m.count; }, 0) + '</td>' + keys.map(function (k) { return '<td class="num">' + (k === 'takeoffs' || k === 'landings' ? r.yearTotal[k] : hm(r.yearTotal[k])) + '</td>'; }).join('') + '</tr></tbody>';
    $('#sumTable').innerHTML = h;
    var th = '<thead><tr><th>型式</th><th class="num">レグ</th><th class="num">飛行時間</th><th class="num">時間 (h)</th></tr></thead><tbody>';
    Object.keys(r.byType).sort().forEach(function (t) { th += '<tr><td>' + esc(t) + '</td><td class="num">' + r.byType[t].legs + '</td><td class="num">' + hm(r.byType[t].block) + '</td><td class="num">' + hours1(r.byType[t].block) + '</td></tr>'; });
    $('#typeTable').innerHTML = th + '</tbody>';
  }).catch(function (e) { toast(e.message, true); });
}
function loadRecency() {
  var d = $('#recencyDays').value;
  call('apiRecency', Number(d)).then(function (t) {
    $('#recencyTitle').textContent = '直近 ' + d + ' 日 (' + t.since + ' 以降, ' + t.count + ' レグ)';
    kpi($('#kpiRecent'), t, ['block', 'pic', 'sic', 'pic_night', 'sic_night', 'ifr', 'takeoffs', 'landings']);
  }).catch(function (e) { toast(e.message, true); });
}

/* ---------- 資格要件 ---------- */
var Q_STATUS = { ok: 'OK', due: '実施期間', warn: '要注意', over: '期限超過', unknown: '未記録', invalid: '日付不正' };
function qItem(cls, title, big, sub) {
  return '<div class="item ' + cls + '"><label>' + esc(title) + '</label><b>' + esc(big) + '</b><div class="sub">' + esc(sub) + '</div></div>';
}
function loadQualification() {
  call('apiQualification').then(function (q) {
    var h = '<div class="q">';
    var lf = q.lastFlight;
    h += qItem(lf.status, '最終乗務からの経過', lf.date ? lf.days + ' 日' : '記録なし',
      (lf.date ? '最終乗務 ' + lf.date + ' / ' : '') + '連続 ' + lf.limit + ' 日以上の中断で復帰訓練');
    var rc = q.recency;
    h += qItem(rc.status, '直近 ' + rc.days + ' 日の離着陸', rc.takeoffs + ' / ' + rc.landings + ' 回', rc.since + ' 以降 / 各 ' + rc.required + ' 回以上');
    q.training.forEach(function (t) {
      h += qItem(t.status, t.label, t.last ? '前回 ' + t.last : '記録なし',
        t.last ? '次回 基準月 ' + t.baseMonth + ' (実施期間 ' + t.windowFrom + ' 〜 ' + t.windowUntil + ') ' + Q_STATUS[t.status] : '飛行内容に ' + t.code + ' と記入すると自動判定');
    });
    if (q.qpr) {
      var lq = q.qpr.last;
      h += qItem(q.qpr.status, 'QPR (' + q.qpr.fy + '年度)', q.qpr.count + ' 回',
        (lq ? '前回 ' + lq.date + ' ' + lq.flight_no + ' ' + lq.dep + '-' + lq.arr : '記録なし') + ' / 入力フォームの「QPR フライト」にチェックしたレグ');
    }
    q.expiries.forEach(function (e) {
      h += qItem(e.status, e.label, e.date ? '有効期限 ' + e.date : '未設定',
        e.date && e.status !== 'invalid' ? (e.daysLeft < 0 ? Math.abs(e.daysLeft) + ' 日超過' : '残り ' + e.daysLeft + ' 日 (' + e.warnDays + ' 日前から警告)') : '設定タブで入力');
    });
    $('#qualBox').innerHTML = h + '</div>';
  }).catch(function (e) { $('#qualBox').textContent = e.message; });
}

/* ---------- year sheets (auto-maintained server-side) ---------- */
function loadReports() {
  call('apiListReports').then(function (list) {
    $('#reportList').innerHTML = list.length ? list.map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') : '<li>まだありません（最初のレグを保存すると作られます）</li>';
  }).catch(function (e) { toast(e.message, true); });
}

/* ---------- settings / import ---------- */
function buildCarryGrid(st) {
  var g = $('#carryGrid'); g.innerHTML = '';
  TOTAL_KEYS.forEach(function (k) {
    var isCount = k === 'takeoffs' || k === 'landings';
    var d = document.createElement('div');
    d.innerHTML = '<label>' + esc(lbl(k)) + (isCount ? ' (回)' : '') + '</label><input class="dur" id="cf_' + k + '" value="' + (isCount ? st.carry_forward[k] : hm(st.carry_forward[k])) + '">';
    g.appendChild(d);
  });
}
// [key, label, input type]  — 'list' = comma-separated dates
var EXP_KEYS = [
  ['department', '所属', 'text'], ['employee_no', '社員番号', 'text'],
  ['base_skill', '技能基準月 (CACK / M12)', 'month'], ['base_route', 'ROUTE CHK 基準月', 'month'], ['base_dit', 'DIT 基準月', 'month'],
  ['dates_cack', 'CACK 実施日', 'list'], ['dates_route', 'ROUTE CHK 実施日', 'list'], ['dates_dit', 'DIT 実施日', 'list'], ['dates_age63', '63歳以上68歳未満付加訓練 実施日', 'list'],
  ['dates_pe', 'PE 実施日', 'list'], ['exp_pe', 'PE 有効期限', 'date'], ['dates_pea', 'PEA 実施日', 'list'], ['exp_pea', 'PEA 有効期限', 'date'],
  ['exp_english', '航空英語能力証明 有効期限 (最大 2)', 'list'], ['exp_competency', '特定操縦技能審査 期間満了日 (最大 5)', 'list'],
  ['exp_passport', 'パスポート 有効期限', 'date'], ['exp_visa', 'VISA 有効期限', 'date']
];
function fillSettings(st) {
  ['pilot_name', 'licence_no', 'time_basis', 'default_aircraft_type'].forEach(function (k) { $('#s_' + k).value = st[k] || ''; });
  var g = $('#expGrid');
  if (!g.children.length) g.innerHTML = EXP_KEYS.map(function (e) {
    var type = e[2] === 'list' ? 'text' : e[2];
    return '<div' + (e[2] === 'list' ? ' style="grid-column: span 2"' : '') + '><label>' + esc(e[1]) + '</label><input type="' + type + '" id="s_' + e[0] + '"' + (e[2] === 'list' ? ' placeholder="YYYY-MM-DD, YYYY-MM-DD"' : '') + '></div>';
  }).join('');
  EXP_KEYS.forEach(function (e) { $('#s_' + e[0]).value = st[e[0]] || ''; });
}
function saveSettings() {
  var o = { carry_forward: {} };
  ['pilot_name', 'licence_no', 'time_basis', 'default_aircraft_type'].forEach(function (k) { o[k] = $('#s_' + k).value; });
  EXP_KEYS.forEach(function (e) { o[e[0]] = $('#s_' + e[0]).value; });
  try { TOTAL_KEYS.forEach(function (k) { var v = $('#cf_' + k).value; o.carry_forward[k] = (k === 'takeoffs' || k === 'landings') ? Number(v) || 0 : toMin(v); }); }
  catch (e) { toast(e.message, true); return; }
  $('#settingsStatus').textContent = '保存中…';
  call('apiSaveSettings', o).then(function () { toast('設定を保存しました'); $('#settingsStatus').textContent = ''; return reboot(); })
    .catch(function (e) { toast(e.message, true); $('#settingsStatus').textContent = ''; });
}
function importCsv() {
  var file = $('#csvFile').files[0]; if (!file) { toast('CSV ファイルを選択してください', true); return; }
  var rd = new FileReader();
  rd.onload = function () {
    $('#importResult').textContent = '取込中… (' + file.name + ')';
    call('apiImportCsv', rd.result, { replace: $('#csvReplace').checked, source: 'csv:' + file.name }).then(function (r) {
      $('#importResult').textContent = '追加 ' + r.inserted + ' / 更新 ' + r.updated + ' / 重複スキップ ' + r.skipped +
        (r.refreshed && r.refreshed.length ? '\n年次シート更新: ' + r.refreshed.join(', ') : '') + (r.errors.length ? '\nエラー:\n' + r.errors.join('\n') : '');
      toast('取込完了'); loadReports(); return reboot();
    }).catch(function (e) { $('#importResult').textContent = 'エラー: ' + e.message; toast(e.message, true); });
  };
  rd.readAsText(file, 'utf-8');
}
</script>
